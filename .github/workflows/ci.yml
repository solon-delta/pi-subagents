name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test "test/*.test.ts"
      - name: Integration tests
        run: node --test "test/integration/*.test.ts"
      - name: Lint
        run: npx oxlint
